<svg width="900" height="383" viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <!-- 增强的原子渐变 -->
    <radialGradient id="carbonGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="oxygenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="nitrogenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="hydrogenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
    
    <!-- 增强的发光效果 -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 文字发光效果 -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 蛋白质链渐变 -->
    <linearGradient id="proteinChain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#f87171;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06d6a0;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="383" fill="url(#bgGradient)"/>
  
  <!-- 装饰性网格背景 -->
  <g opacity="0.1">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="900" height="383" fill="url(#grid)"/>
  </g>
  
  <!-- 大型蛋白质分子结构 - 中心位置 -->
  <g transform="translate(200, 191.5)">
    <!-- 蛋白质骨架链 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="30s" repeatCount="indefinite"/>
      <!-- 主链 -->
      <path d="M -80,-60 Q -40,-80 0,-60 Q 40,-40 80,-60 Q 120,-80 160,-60" 
            fill="none" stroke="url(#proteinChain)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
      <path d="M -80,60 Q -40,80 0,60 Q 40,40 80,60 Q 120,80 160,60" 
            fill="none" stroke="url(#proteinChain)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
      <path d="M -80,-60 Q -100,0 -80,60" 
            fill="none" stroke="url(#proteinChain)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
      <path d="M 160,-60 Q 180,0 160,60" 
            fill="none" stroke="url(#proteinChain)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
    </g>
    
    <!-- 外层轨道 - 更大更明显 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="25s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="120" ry="60" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
      <ellipse cx="0" cy="0" rx="60" ry="120" fill="none" stroke="#f87171" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
    </g>
    
    <!-- 中层轨道 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;-360 0 0" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="90" ry="45" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.7" filter="url(#glow)"/>
      <ellipse cx="0" cy="0" rx="45" ry="90" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.7" filter="url(#glow)"/>
    </g>
    
    <!-- 中心大型原子团 -->
    <circle cx="0" cy="0" r="18" fill="url(#carbonGradient)" filter="url(#strongGlow)"/>
    
    <!-- 主要氨基酸残基 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="35s" repeatCount="indefinite"/>
      <!-- 大型氧原子 -->
      <circle cx="0" cy="-80" r="12" fill="url(#oxygenGradient)" filter="url(#strongGlow)"/>
      <circle cx="80" cy="0" r="12" fill="url(#oxygenGradient)" filter="url(#strongGlow)"/>
      <circle cx="0" cy="80" r="12" fill="url(#oxygenGradient)" filter="url(#strongGlow)"/>
      <circle cx="-80" cy="0" r="12" fill="url(#oxygenGradient)" filter="url(#strongGlow)"/>
      
      <!-- 大型氮原子 -->
      <circle cx="60" cy="-60" r="10" fill="url(#nitrogenGradient)" filter="url(#strongGlow)"/>
      <circle cx="-60" cy="60" r="10" fill="url(#nitrogenGradient)" filter="url(#strongGlow)"/>
      <circle cx="60" cy="60" r="10" fill="url(#nitrogenGradient)" filter="url(#strongGlow)"/>
      <circle cx="-60" cy="-60" r="10" fill="url(#nitrogenGradient)" filter="url(#strongGlow)"/>
    </g>
    
    <!-- 侧链氢原子群 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;-360 0 0" dur="12s" repeatCount="indefinite"/>
      <circle cx="50" cy="-50" r="6" fill="url(#hydrogenGradient)" filter="url(#glow)"/>
      <circle cx="-50" cy="50" r="6" fill="url(#hydrogenGradient)" filter="url(#glow)"/>
      <circle cx="50" cy="50" r="6" fill="url(#hydrogenGradient)" filter="url(#glow)"/>
      <circle cx="-50" cy="-50" r="6" fill="url(#hydrogenGradient)" filter="url(#glow)"/>
      <circle cx="70" cy="-30" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="-70" cy="30" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="30" cy="70" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="-30" cy="-70" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
    </g>
    
    <!-- 增强的化学键 -->
    <g opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#22d3ee" stroke-width="4" filter="url(#glow)"/>
      <line x1="0" y1="0" x2="80" y2="0" stroke="#f87171" stroke-width="4" filter="url(#glow)"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#60a5fa" stroke-width="4" filter="url(#glow)"/>
      <line x1="0" y1="0" x2="-80" y2="0" stroke="#fbbf24" stroke-width="4" filter="url(#glow)"/>
      <!-- 对角线键 -->
      <line x1="0" y1="0" x2="60" y2="-60" stroke="#06d6a0" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="0" x2="-60" y2="60" stroke="#f72585" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#4cc9f0" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="0" x2="-60" y2="-60" stroke="#a855f7" stroke-width="3" opacity="0.7"/>
    </g>
  </g>
  
  <!-- 主标题 - 调整位置以突出蛋白质 -->
  <g transform="translate(500, 120)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" 
          font-size="42" font-weight="bold" fill="#ffffff" filter="url(#textGlow)">
      GMXHELPER
    </text>
  </g>
  
  <!-- 副标题 -->
  <g transform="translate(500, 160)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" 
          font-size="20" font-weight="normal" fill="#94a3b8">
      蛋白质分子动力学模拟助手
    </text>
  </g>
  
  <!-- GROMACS标识 -->
  <g transform="translate(520, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#06d6a0" filter="url(#textGlow)">G</text>
    <text x="18" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#f72585" filter="url(#textGlow)">R</text>
    <text x="36" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#4cc9f0" filter="url(#textGlow)">O</text>
    <text x="54" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#fbbf24" filter="url(#textGlow)">M</text>
    <text x="74" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#22d3ee" filter="url(#textGlow)">A</text>
    <text x="92" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#f87171" filter="url(#textGlow)">C</text>
    <text x="110" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#60a5fa" filter="url(#textGlow)">S</text>
  </g>
  
  <!-- 蛋白质标识 -->
  <g transform="translate(500, 240)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#22d3ee" opacity="0.8">PROTEIN DYNAMICS</text>
  </g>
  
  <!-- 右侧辅助分子群 -->
  <g transform="translate(700, 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;-360 0 0" dur="40s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="8" fill="url(#carbonGradient)" filter="url(#glow)"/>
      <circle cx="25" cy="0" r="6" fill="url(#oxygenGradient)" filter="url(#glow)"/>
      <circle cx="-25" cy="0" r="6" fill="url(#nitrogenGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="25" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="0" cy="-25" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <line x1="0" y1="0" x2="25" y2="0" stroke="#e2e8f0" stroke-width="2" opacity="0.6"/>
      <line x1="0" y1="0" x2="-25" y2="0" stroke="#e2e8f0" stroke-width="2" opacity="0.6"/>
      <line x1="0" y1="0" x2="0" y2="25" stroke="#e2e8f0" stroke-width="2" opacity="0.6"/>
      <line x1="0" y1="0" x2="0" y2="-25" stroke="#e2e8f0" stroke-width="2" opacity="0.6"/>
    </g>
  </g>
  
  <g transform="translate(750, 280)">
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="35s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="6" fill="url(#nitrogenGradient)" filter="url(#glow)"/>
      <circle cx="20" cy="0" r="5" fill="url(#carbonGradient)" filter="url(#glow)"/>
      <circle cx="-20" cy="0" r="5" fill="url(#oxygenGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="20" r="3" fill="url(#hydrogenGradient)" opacity="0.7"/>
      <circle cx="0" cy="-20" r="3" fill="url(#hydrogenGradient)" opacity="0.7"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#e2e8f0" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="0" x2="-20" y2="0" stroke="#e2e8f0" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
  
  <!-- 增强的装饰性粒子效果 -->
  <g opacity="0.6">
    <circle cx="50" cy="50" r="3" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="60" r="3" fill="#f87171" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="320" r="3" fill="#60a5fa" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="330" r="3" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="30" r="2" fill="#06d6a0" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="350" r="2" fill="#f72585" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.8;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 顶部高光效果 -->
  <ellipse cx="450" cy="50" rx="200" ry="20" fill="#ffffff" opacity="0.15"/>
  
  <!-- 底部渐变装饰 -->
  <rect x="0" y="350" width="900" height="33" fill="url(#bgGradient)" opacity="0.3"/>
</svg>