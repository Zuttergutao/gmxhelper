<svg width="900" height="383" viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <!-- 原子渐变 -->
    <radialGradient id="carbonGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="oxygenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="nitrogenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="hydrogenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 文字发光效果 -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="383" fill="url(#bgGradient)"/>
  
  <!-- 装饰性网格背景 -->
  <g opacity="0.1">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="900" height="383" fill="url(#grid)"/>
  </g>
  
  <!-- 左侧分子结构区域 -->
  <g transform="translate(150, 191.5)">
    <!-- 外层轨道 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="80" ry="40" fill="none" stroke="#475569" stroke-width="2" opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#475569" stroke-width="2" opacity="0.3"/>
    </g>
    
    <!-- 中层轨道 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;-360 0 0" dur="15s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="60" ry="30" fill="none" stroke="#64748b" stroke-width="2" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="30" ry="60" fill="none" stroke="#64748b" stroke-width="2" opacity="0.4"/>
    </g>
    
    <!-- 中心碳原子 -->
    <circle cx="0" cy="0" r="12" fill="url(#carbonGradient)" filter="url(#glow)"/>
    
    <!-- 周围原子 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="25s" repeatCount="indefinite"/>
      <!-- 氧原子 -->
      <circle cx="0" cy="-50" r="8" fill="url(#oxygenGradient)" filter="url(#glow)"/>
      <circle cx="50" cy="0" r="8" fill="url(#oxygenGradient)" filter="url(#glow)"/>
      
      <!-- 氮原子 -->
      <circle cx="0" cy="50" r="8" fill="url(#nitrogenGradient)" filter="url(#glow)"/>
      <circle cx="-50" cy="0" r="8" fill="url(#nitrogenGradient)" filter="url(#glow)"/>
    </g>
    
    <!-- 氢原子 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;-360 0 0" dur="8s" repeatCount="indefinite"/>
      <circle cx="35" cy="-35" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="-35" cy="35" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="35" cy="35" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
      <circle cx="-35" cy="-35" r="4" fill="url(#hydrogenGradient)" opacity="0.8"/>
    </g>
    
    <!-- 化学键 -->
    <g opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="0" y1="0" x2="50" y2="0" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="0" y1="0" x2="-50" y2="0" stroke="#e2e8f0" stroke-width="3"/>
    </g>
  </g>
  
  <!-- 主标题 -->
  <g transform="translate(400, 150)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" 
          font-size="48" font-weight="bold" fill="#ffffff" filter="url(#textGlow)">
      GMXHELPER
    </text>
  </g>
  
  <!-- 副标题 -->
  <g transform="translate(400, 200)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" 
          font-size="24" font-weight="normal" fill="#94a3b8">
      分子动力学模拟的小助手
    </text>
  </g>
  
  <!-- GROMACS标识 -->
  <g transform="translate(420, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#06d6a0" filter="url(#textGlow)">G</text>
    <text x="22" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#f72585" filter="url(#textGlow)">R</text>
    <text x="44" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#4cc9f0" filter="url(#textGlow)">O</text>
    <text x="66" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#fbbf24" filter="url(#textGlow)">M</text>
    <text x="90" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#22d3ee" filter="url(#textGlow)">A</text>
    <text x="112" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#f87171" filter="url(#textGlow)">C</text>
    <text x="134" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#60a5fa" filter="url(#textGlow)">S</text>
  </g>
  
  <!-- 代码符号装饰 -->
  <g transform="translate(650, 260)">
    <text x="0" y="0" font-family="monospace" font-size="28" font-weight="bold" 
          fill="#94a3b8" opacity="0.7">&lt;/&gt;</text>
  </g>
  
  <!-- 右侧装饰性分子 -->
  <g transform="translate(750, 191.5)">
    <g>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;-360 0 0" dur="30s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="6" fill="url(#carbonGradient)" opacity="0.6"/>
      <circle cx="20" cy="0" r="4" fill="url(#oxygenGradient)" opacity="0.6"/>
      <circle cx="-20" cy="0" r="4" fill="url(#nitrogenGradient)" opacity="0.6"/>
      <circle cx="0" cy="20" r="3" fill="url(#hydrogenGradient)" opacity="0.6"/>
      <circle cx="0" cy="-20" r="3" fill="url(#hydrogenGradient)" opacity="0.6"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-20" y2="0" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
    </g>
  </g>
  
  <!-- 装饰性粒子效果 -->
  <g opacity="0.4">
    <circle cx="50" cy="50" r="2" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="60" r="2" fill="#f87171">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="320" r="2" fill="#60a5fa">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="330" r="2" fill="#fbbf24">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="30" r="1" fill="#06d6a0">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="350" r="1" fill="#f72585">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 顶部高光效果 -->
  <ellipse cx="450" cy="50" rx="200" ry="20" fill="#ffffff" opacity="0.1"/>
  
  <!-- 底部渐变装饰 -->
  <rect x="0" y="350" width="900" height="33" fill="url(#bgGradient)" opacity="0.3"/>
</svg>