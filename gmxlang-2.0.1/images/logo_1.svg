<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </radialGradient>
    
    <!-- 原子渐变 -->
    <radialGradient id="carbonGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="oxygenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="nitrogenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="hydrogenGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 轨道动画 -->
    <animateTransform id="orbit1" attributeName="transform" type="rotate" 
                      values="0 64 64;360 64 64" dur="8s" repeatCount="indefinite"/>
    <animateTransform id="orbit2" attributeName="transform" type="rotate" 
                      values="0 64 64;-360 64 64" dur="12s" repeatCount="indefinite"/>
  </defs>
  
  <!-- 背景 -->
  <rect width="128" height="128" rx="20" fill="url(#bgGradient)"/>
  
  <!-- 外层轨道 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 64 64;360 64 64" dur="15s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="64" rx="50" ry="25" fill="none" stroke="#475569" stroke-width="1" opacity="0.3"/>
    <ellipse cx="64" cy="64" rx="25" ry="50" fill="none" stroke="#475569" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- 中层轨道 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 64 64;-360 64 64" dur="10s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="64" rx="35" ry="18" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4"/>
    <ellipse cx="64" cy="64" rx="18" ry="35" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- 分子结构 - 中心原子团 -->
  <!-- 中心碳原子 -->
  <circle cx="64" cy="64" r="8" fill="url(#carbonGradient)" filter="url(#glow)"/>
  
  <!-- 周围原子 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 64 64;360 64 64" dur="20s" repeatCount="indefinite"/>
    <!-- 氧原子 -->
    <circle cx="64" cy="40" r="6" fill="url(#oxygenGradient)" filter="url(#glow)"/>
    <circle cx="88" cy="64" r="6" fill="url(#oxygenGradient)" filter="url(#glow)"/>
    
    <!-- 氮原子 -->
    <circle cx="64" cy="88" r="6" fill="url(#nitrogenGradient)" filter="url(#glow)"/>
    <circle cx="40" cy="64" r="6" fill="url(#nitrogenGradient)" filter="url(#glow)"/>
  </g>
  
  <!-- 氢原子（小原子，快速运动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 64 64;-360 64 64" dur="5s" repeatCount="indefinite"/>
    <circle cx="76" cy="52" r="3" fill="url(#hydrogenGradient)" opacity="0.8"/>
    <circle cx="52" cy="76" r="3" fill="url(#hydrogenGradient)" opacity="0.8"/>
    <circle cx="76" cy="76" r="3" fill="url(#hydrogenGradient)" opacity="0.8"/>
    <circle cx="52" cy="52" r="3" fill="url(#hydrogenGradient)" opacity="0.8"/>
  </g>
  
  <!-- 化学键 -->
  <g opacity="0.6">
    <line x1="64" y1="64" x2="64" y2="40" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="64" y1="64" x2="88" y2="64" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="64" y1="64" x2="64" y2="88" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="64" y1="64" x2="40" y2="64" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  
  <!-- GROMACS标识 -->
  <g transform="translate(0, 95)">
    <!-- G -->
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#06d6a0" opacity="0.9">G</text>
    <!-- M -->
    <text x="32" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#f72585" opacity="0.9">M</text>
    <!-- X -->
    <text x="48" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          fill="#4cc9f0" opacity="0.9">X</text>
  </g>
  
  <!-- 代码符号 -->
  <text x="75" y="115" font-family="monospace" font-size="14" font-weight="bold" 
        fill="#94a3b8" opacity="0.7">&lt;/&gt;</text>
  
  <!-- 装饰性粒子效果 -->
  <g opacity="0.4">
    <circle cx="20" cy="25" r="1" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="30" r="1" fill="#f87171">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="100" r="1" fill="#60a5fa">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="105" r="1" fill="#fbbf24">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 顶部高光效果 -->
  <ellipse cx="64" cy="25" rx="30" ry="8" fill="#ffffff" opacity="0.1"/>
</svg>